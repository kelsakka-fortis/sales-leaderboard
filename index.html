<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="1800">
<title>Fortis Sales Leaderboard</title>
<style>
  :root{
    color-scheme: light;
    --bg-0:#ffffff;
    --bg-1:#f6f4ff;
    --line:rgba(28,10,85,0.10);
    --text-0:#1c0a55;
    --text-1:#564d80;
    --text-2:#8b83ad;
    --gold:#f4c04d;
    --silver:#aab0c4;
    --bronze:#e0a56f;
    --violet:#6c3fce;
    --violet-2:#a58aef;
    --lime-2:#cfe3ba;
    --ink:#1c0a55;
    --revenue-grad: linear-gradient(90deg,#5c8a3c,#93b56b);
    --deals-grad: linear-gradient(90deg,#6c3fce,#a58aef);
    font-size: clamp(12px, 1.05vw, 26px);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:
      radial-gradient(ellipse at 12% 0%, rgba(111,156,70,0.12), transparent 45%),
      radial-gradient(ellipse at 88% 100%, rgba(108,63,206,0.12), transparent 45%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1) 55%, var(--bg-0));
    color:var(--text-0);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    overflow:hidden;
  }
  .stage{ width:100vw; height:100vh; display:flex; flex-direction:column; padding:1.6rem 2.4rem 1.2rem; }
  header{ display:flex; align-items:flex-end; justify-content:space-between; padding-bottom:1rem; margin-bottom:1.1rem; border-bottom:1px solid var(--line); flex:0 0 auto; }
  .brand{ display:flex; align-items:center; gap:1.1rem; }
  .brand .logo{ height:2.3rem; width:auto; flex:0 0 auto; }
  .brand .brand-text{ display:flex; flex-direction:column; gap:.2rem; }
  .brand .eyebrow{ font-size:.78rem; letter-spacing:.35em; color:var(--text-2); text-transform:uppercase; font-weight:700; }
  .brand h1{ margin:0; font-size:2.5rem; font-weight:800; letter-spacing:.01em;
    background: linear-gradient(90deg, #1c0a55, #6c3fce 60%, #5c8a3c);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .scope{ text-align:right; color:var(--text-1); font-size:.95rem; line-height:1.5; }
  .scope b{ color:var(--text-0); }
  .scope .pill{ display:inline-block; margin-top:.35rem; padding:.25rem .8rem; border:1px solid transparent; border-radius:999px; font-size:.75rem; font-weight:700; color:var(--ink); background:var(--lime-2); }
  .grid{ flex:1 1 auto; display:grid; grid-template-columns:1fr 1fr; gap:2rem; min-height:0; }
  .col{ display:flex; flex-direction:column; min-height:0; background:#fff; border:1px solid var(--line); border-radius:1.1rem; padding:1.2rem 1.5rem; position:relative; overflow:hidden; box-shadow:0 18px 40px -24px rgba(28,10,85,0.25); }
  .col.revenue{ border-color:rgba(111,156,70,0.35); }
  .col.deals{ border-color:rgba(108,63,206,0.3); }
  .col-title{ display:flex; align-items:center; gap:.6rem; flex:0 0 auto; margin-bottom:.9rem; }
  .col-title .icon{ width:2.1rem; height:2.1rem; border-radius:.6rem; display:flex; align-items:center; justify-content:center; font-size:1.15rem; flex:0 0 auto; }
  .revenue .col-title .icon{ background:var(--revenue-grad); color:var(--ink); }
  .deals .col-title .icon{ background:var(--deals-grad); color:#fff; }
  .col-title h2{ margin:0; font-size:1.35rem; font-weight:700; color:var(--text-0); }
  .col-title span.sub{ color:var(--text-2); font-size:.8rem; font-weight:500; margin-left:.3rem; }
  .podium{ display:grid; grid-template-columns:1fr 1.3fr 1fr; gap:.8rem; align-items:end; flex:0 0 auto; margin-bottom:1.1rem; min-height:6.5rem; }
  .p-card{ border-radius:.9rem; padding:.8rem .9rem; position:relative; border:1px solid var(--line); background:linear-gradient(180deg,#fbfaff,#f3f0ff); text-align:center; }
  .p-card .rank{ position:absolute; top:-.55rem; left:50%; transform:translateX(-50%); font-size:.72rem; font-weight:800; padding:.15rem .55rem; border-radius:999px; letter-spacing:.05em; }
  .p-card.gold{ order:2; padding-top:1.3rem; box-shadow:0 0 0 1px rgba(244,192,77,.5), 0 18px 40px -14px rgba(244,192,77,.4); }
  .p-card.gold .rank{ background:var(--gold); color:#241300; }
  .p-card.silver{ order:1; } .p-card.silver .rank{ background:var(--silver); color:#fff; }
  .p-card.bronze{ order:3; } .p-card.bronze .rank{ background:var(--bronze); color:#241300; }
  .p-card .medal{ font-size:1.4rem; margin-bottom:.15rem; } .p-card.gold .medal{ font-size:1.9rem; }
  .p-card .name{ font-weight:700; font-size:.92rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text-0); }
  .p-card.gold .name{ font-size:1.15rem; }
  .p-card .value{ font-weight:800; font-size:1.1rem; margin-top:.2rem; } .p-card.gold .value{ font-size:1.6rem; }
  .revenue .p-card.gold .value{ background:var(--revenue-grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .deals .p-card.gold .value{ background:var(--deals-grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .revenue .p-card:not(.gold) .value{ color:#4f7a2c; }
  .deals .p-card:not(.gold) .value{ color:var(--violet); }
  .chart{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:.42rem; justify-content:space-between; padding-top:.2rem; }
  .bar-row{ display:grid; grid-template-columns:8.5rem 1fr 4.6rem; align-items:center; gap:.6rem; opacity:0; transform:translateX(-8px); animation:rise .5s ease forwards; }
  .bar-row .rank-badge{ width:1.15rem; height:1.15rem; border-radius:50%; font-size:.62rem; font-weight:800; display:flex; align-items:center; justify-content:center; flex:0 0 auto; margin-right:.35rem; }
  .bar-row.top1 .rank-badge{ background:var(--gold); color:#241300; }
  .bar-row.top2 .rank-badge{ background:var(--silver); color:#fff; }
  .bar-row.top3 .rank-badge{ background:var(--bronze); color:#241300; }
  .bar-row:not(.top1):not(.top2):not(.top3) .rank-badge{ background:rgba(28,10,85,0.08); color:var(--text-2); }
  .bar-row .agent-label{ display:flex; align-items:center; font-size:.78rem; color:var(--text-1); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar-row.top1 .agent-label, .bar-row.top2 .agent-label, .bar-row.top3 .agent-label{ color:var(--text-0); font-weight:600; }
  .track{ position:relative; height:.62rem; background:rgba(28,10,85,0.07); border-radius:999px; overflow:hidden; }
  .fill{ position:absolute; left:0; top:0; bottom:0; width:0; border-radius:999px; transition:width 1.1s cubic-bezier(.2,.8,.2,1); }
  .revenue .fill{ background:var(--revenue-grad); }
  .deals .fill{ background:var(--deals-grad); }
  .revenue .bar-row.top1 .fill{ box-shadow:0 0 10px rgba(92,138,60,.5); }
  .deals .bar-row.top1 .fill{ box-shadow:0 0 10px rgba(108,63,206,.55); }
  .bar-row .val{ font-size:.78rem; font-weight:700; text-align:right; color:var(--text-0); }
  @keyframes rise{ to{ opacity:1; transform:translateX(0);} }
  .empty-state{ flex:1; display:flex; align-items:center; justify-content:center; color:var(--text-2); font-size:.85rem; text-align:center; padding:2rem; }
  footer{ flex:0 0 auto; margin-top:1rem; display:flex; justify-content:space-between; color:var(--text-2); font-size:.72rem; border-top:1px solid var(--line); padding-top:.7rem; }
</style>
</head>

<script>
const snapshot = JSON.parse(document.getElementById("snapshot-data").textContent);
function fmtMoney(v){ return "AED " + v.toLocaleString(undefined, { maximumFractionDigits: 0 }); }
function fmtCount(v){ return v + (v === 1 ? " deal" : " deals"); }
function pad3(list){ const out = list.slice(0, 3); while (out.length < 3) out.push({ name: "—", value: 0 }); return out; }
function buildPodium(containerId, data, formatter){
  const el = document.getElementById(containerId);
  const [first, second, third] = pad3(data);
  const medals = { gold: "🥇", silver: "🥈", bronze: "🥉" };
  el.innerHTML = `
    <div class="p-card silver"><div class="rank">RUNNER-UP</div><div class="medal">${medals.silver}</div><div class="name">${second.name}</div><div class="value">${formatter(second.value)}</div></div>
    <div class="p-card gold"><div class="rank">TOP PERFORMER</div><div class="medal">${medals.gold}</div><div class="name">${first.name}</div><div class="value">${formatter(first.value)}</div></div>
    <div class="p-card bronze"><div class="rank">RUNNER-UP</div><div class="medal">${medals.bronze}</div><div class="name">${third.name}</div><div class="value">${formatter(third.value)}</div></div>`;
}
function buildChart(containerId, data, formatter){
  const el = document.getElementById(containerId);
  if (data.length === 0){ el.innerHTML = `<div class="empty-state">No won deals recorded yet this month.</div>`; return; }
  const max = data[0].value || 1;
  el.innerHTML = data.map((d,i)=>{
    const cls = i===0?"top1":i===1?"top2":i===2?"top3":"";
    const pct = Math.max((d.value/max*100), 2);
    return `<div class="bar-row ${cls}" style="animation-delay:${i*35}ms"><div class="agent-label"><span class="rank-badge">${i+1}</span>${d.name}</div><div class="track"><div class="fill" data-w="${pct}"></div></div><div class="val">${formatter(d.value)}</div></div>`;
  }).join("");
  requestAnimationFrame(()=>{ setTimeout(()=>{ el.querySelectorAll(".fill").forEach(f => { f.style.width = f.dataset.w + "%"; }); }, 150); });
}
buildPodium("podium-revenue", snapshot.revenueData, fmtMoney);
buildPodium("podium-deals", snapshot.dealsData, fmtCount);
buildChart("chart-revenue", snapshot.revenueData, fmtMoney);
buildChart("chart-deals", snapshot.dealsData, fmtCount);
const totalRevenue = snapshot.revenueData.reduce((s,d)=>s+d.value, 0);
const totalDeals = snapshot.dealsData.reduce((s,d)=>s+d.value, 0);
const generated = new Date(snapshot.generatedAtUtc);
document.getElementById("totals").textContent = "Total: " + fmtMoney(totalRevenue) + " · " + totalDeals + " deals won · Snapshot pushed " + generated.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
</script>
